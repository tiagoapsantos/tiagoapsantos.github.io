<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMaxYMid slice">
  <!-- Fundo do banner da página inicial: brilho suave, círculos concêntricos (como o logótipo) e grelha de pontos. -->
  <defs>
    <radialGradient id="brilho" cx="1170" cy="400" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f17659" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#f17659" stop-opacity=".05"/>
      <stop offset="1" stop-color="#f17659" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pontos" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.1" fill="#f3f0e7" fill-opacity=".09"/>
    </pattern>
    <linearGradient id="desvanecer" x1="0" x2="1" y1="0" y2="0">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mascara"><rect width="1600" height="800" fill="url(#desvanecer)"/></mask>
  </defs>
  <rect width="1600" height="800" fill="url(#brilho)"/>
  <rect width="1600" height="800" fill="url(#pontos)" mask="url(#mascara)"/>
  <g fill="none" stroke="#f3f0e7" stroke-opacity=".07" stroke-width="1">
    <circle cx="1170" cy="400" r="110"/>
    <circle cx="1170" cy="400" r="190"/>
    <circle cx="1170" cy="400" r="270"/>
    <circle cx="1170" cy="400" r="350"/>
    <circle cx="1170" cy="400" r="430"/>
    <circle cx="1170" cy="400" r="510"/>
    <circle cx="1170" cy="400" r="590"/>
  </g>
  <!-- Dois arcos na cor de destaque -->
  <g fill="none" stroke="#f17659" stroke-linecap="round">
    <path d="M 1170 130 A 270 270 0 0 1 1420 296" stroke-width="2" stroke-opacity=".55"/>
    <path d="M 820 400 A 350 350 0 0 1 900 177" stroke-width="1.5" stroke-opacity=".3"/>
  </g>
  <circle cx="1420" cy="296" r="4" fill="#f17659" fill-opacity=".8"/>
  <circle cx="1170" cy="400" r="3" fill="#f3f0e7" fill-opacity=".35"/>
  <line x1="1170" y1="0" x2="1170" y2="800" stroke="#f3f0e7" stroke-opacity=".04"/>
  <line x1="560" y1="400" x2="1600" y2="400" stroke="#f3f0e7" stroke-opacity=".04"/>
</svg>
